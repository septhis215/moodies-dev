name: PR checks

on:
  pull_request:
    branches: [trunk]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run generate --workspace server

      - name: Server lint
        run: npm run lint:check --workspace server

      - name: Server typecheck
        run: npm run typecheck --workspace server

      - name: Server build
        run: npm run build --workspace server

      - name: Server tests
        run: npm test --workspace server -- --runInBand

      - name: Client lint
        run: npm run lint:check --workspace client

      - name: Client typecheck
        run: npm run typecheck --workspace client

      - name: Install Playwright Chromium
        run: npx --workspace client playwright install --with-deps chromium

      - name: Client tests
        run: npm test --workspace client
        env:
          STORYBOOK_DISABLE_TELEMETRY: "1"

      - name: Client build
        run: npm run build --workspace client
