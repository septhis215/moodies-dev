services:
  postgres-dev:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin@123
      POSTGRES_DB: moodies-postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - moodies-net

  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongodata:/data/db
    ports:
      - "27017:27017"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    # For local: set DOPPLER_TOKEN in your shell or a local .env at repo root (gitignored).
    # For CI/CD: inject DOPPLER_TOKEN as a pipeline secret.
    # Fallback: if DOPPLER_TOKEN is unset, env_file is used instead.
    env_file:
      - path: ./server/.env.staging
        required: false
    environment:
      NODE_ENV: staging
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:-}
    depends_on:
      - postgres-dev
      - mongo
    ports:
      - "4000:4000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        APP_ENV: staging
    env_file:
      - path: ./client/.env.staging
        required: false
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN:-}
    depends_on:
      - server
    ports:
      - "3000:3000"

networks:
  moodies-net:

volumes:
  pgdata:
  mongodata:
